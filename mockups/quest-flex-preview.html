<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>解謎 Flex Message Mockup</title>
    <style>
      :root {
        font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: #171b22;
        background: #eeeeee;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #eeeeee; }
      main { padding: 32px 20px 48px; }
      h1 { margin: 0 0 8px; text-align: center; font-size: 24px; }
      .subtitle { text-align: center; color: #585e68; font-size: 13px; margin: 0 0 32px; }
      .previews { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 48px; }
      .preview { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .carousel-bubbles { display: flex; flex-direction: row; gap: 10px; align-items: flex-start; }
      .label { color: #585e68; font-size: 14px; font-weight: 700; text-align: center; }
      .sublabel { color: #585e68; font-size: 11px; text-align: center; margin-top: -6px; }

      /* ── shared bubble shell ── */
      .bubble { overflow: hidden; background: #fcfaf6; border-radius: 20px; box-shadow: 0 5px 18px rgba(23, 27, 34, .14); }
      .bubble-micro { width: 220px; }
      .bubble-nano  { width: 160px; }

      /* ── shared layout primitives (mirrors equipment-flex-preview.html) ── */
      .box { display: flex; min-width: 0; }
      .vertical   { flex-direction: column; }
      .horizontal { flex-direction: row; }
      .center  { align-items: center; }
      .grow    { flex: 1; min-width: 0; }
      .header  { padding: 10px 14px 10px; background: #b6322d; }
      .bar     { width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0; }
      .section-title { display: flex; align-items: center; padding: 8px 12px 6px; }
      .section-text  { margin-left: 8px; font-size: 13px; font-weight: 700; }

      /* ── GodQuest: 神武禁地 diamond grid ── */
      .godquest-header-title {
        color: #fcfaf6;
        font-size: 13px;
        font-weight: 700;
      }
      .godquest-header-sub {
        color: #fcfaf6;
        font-size: 10px;
        margin-top: 2px;
        opacity: .8;
      }
      .godquest-grid-area {
        background: #f9f6f1;
        padding: 12px 8px 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .grid-row {
        display: flex;
        flex-direction: row;
        gap: 5px;
        justify-content: center;
      }
      .grid-cell {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid #dbd7cf;
        background: #fcfaf6;
        font-size: 20px;
        font-weight: 700;
        color: #171b22;
        flex-shrink: 0;
      }
      .grid-cell.leaked {
        background: #b6322d;
        border-color: #b6322d;
        color: #fcfaf6;
      }
      /* transparent spacer — same size as a cell but invisible */
      .grid-spacer {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        background: transparent;
      }

      /* ── SevenStar: 北斗七星 night sky ── */
      .star-bubble-body {
        background: #171b22;
        padding: 8px 8px 6px;
      }
      .star-bubble-title {
        color: #dbd7cf;
        font-size: 10px;
        font-weight: 700;
        margin-bottom: 4px;
        letter-spacing: .04em;
      }
      .star-field {
        position: relative;
        height: 200px;
        width: 100%;
      }
      .star-pill {
        position: absolute;
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        line-height: 1.3;
      }
      .star-pill.on  { background: #2c6194; color: #fcfaf6; }
      .star-pill.off { background: #585e68; color: #dbd7cf; font-weight: 400; }

      /* ── SevenStar Manual: 使用說明 ── */
      .manual-bubble-body {
        background: #fcfaf6;
        padding: 0;
      }
      .manual-header {
        display: flex;
        align-items: center;
        padding: 10px 12px 8px;
      }
      .manual-steps {
        display: flex;
        flex-direction: column;
        padding: 0 12px 12px;
        gap: 5px;
      }
      .manual-step-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 7px;
        background: #f9f6f1;
        border-radius: 6px;
        padding: 6px 8px;
      }
      .step-num {
        color: #b6322d;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .step-text {
        color: #171b22;
        font-size: 11px;
        line-height: 1.35;
      }

      @media (max-width: 720px) {
        main { padding-left: 12px; padding-right: 12px; }
        .previews { gap: 32px; }
        .carousel-bubbles { flex-direction: column; align-items: center; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>解謎 Flex Message Mockup</h1>
      <p class="subtitle">神武禁地 ／ 北斗七星  —  proposed redesign using wuxia palette</p>

      <div class="previews">

        <!-- ═══════════════════════════════════════════════════════
             SECTION 1: 神武禁地 (GodQuest) — diamond magic-square
             Command: 180 {sum} {leak}
             numbers[] sample: [6, 7, 8, 1, 9, 5, 4, 3, 2]
             numbers[1] = 7 is the leaked/known number (red cell)
             Diamond shape:
                   [0]
               [_][1][8][_]
               [2][_][_][7]
               [3][4][5][6]
        ══════════════════════════════════════════════════════════ -->
        <section class="preview">
          <div class="label">神武禁地解答</div>
          <div class="sublabel">180 {總和} {已知數字} → 解算九宮格</div>
          <article class="bubble bubble-micro">
            <!-- primary header band -->
            <div class="box vertical header">
              <div class="godquest-header-title">神武禁地</div>
              <div class="godquest-header-sub">紅色格為已知數字</div>
            </div>
            <!-- diamond grid -->
            <div class="godquest-grid-area">
              <!-- row 0: single top cell [numbers[0]] -->
              <div class="grid-row">
                <div class="grid-cell">6</div>
              </div>
              <!-- row 1: [spacer][numbers[1]=leaked][numbers[8]][spacer] -->
              <div class="grid-row">
                <div class="grid-spacer"></div>
                <div class="grid-cell leaked">7</div>
                <div class="grid-cell">2</div>
                <div class="grid-spacer"></div>
              </div>
              <!-- row 2: [numbers[2]][spacer][spacer][numbers[7]] -->
              <div class="grid-row">
                <div class="grid-cell">8</div>
                <div class="grid-spacer"></div>
                <div class="grid-spacer"></div>
                <div class="grid-cell">3</div>
              </div>
              <!-- row 3: [numbers[3]][numbers[4]][numbers[5]][numbers[6]] -->
              <div class="grid-row">
                <div class="grid-cell">1</div>
                <div class="grid-cell">9</div>
                <div class="grid-cell">5</div>
                <div class="grid-cell">4</div>
              </div>
            </div>
          </article>
        </section>

        <!-- ═══════════════════════════════════════════════════════
             SECTION 2: 北斗七星 carousel (SevenStar + Manual)
             Command: 175 {number 1–127}
             Converts to 7-bit binary → 開/關 per star position
             Sample input: 175 86  → binary 1010110 → 開關開開關開關 (reversed)
             result[] = ["開","關","開","開","關","開","關"]  (index 0→6)
             Positions mirror the Big Dipper constellation shape.
        ══════════════════════════════════════════════════════════ -->
        <section class="preview">
          <div class="label">北斗七星解答 + 使用說明</div>
          <div class="sublabel">175 {數字} → 七星開關位置</div>
          <div class="carousel-bubbles">

            <!-- bubble 1: constellation map -->
            <article class="bubble bubble-nano">
              <div class="star-bubble-body">
                <div class="star-bubble-title">✦ 北斗七星</div>
                <div class="star-field">
                  <!-- positions match genSevenStarBubble offsets exactly:
                       [0] offsetStart 20%  offsetTop 10%
                       [1] offsetEnd   20%  offsetTop 10%
                       [2] offsetEnd   20%  offsetTop 30%
                       [3] offsetStart 19%  offsetTop 30%
                       [4] offsetStart 20%  offsetTop 50%
                       [5] offsetStart 30%  offsetTop 70%
                       [6] offsetEnd   25%  offsetBottom 10%
                  -->
                  <span class="star-pill on"  style="left:20%;  top:10%;">• 開</span>
                  <span class="star-pill off" style="right:20%; top:10%;">關</span>
                  <span class="star-pill on"  style="right:20%; top:30%;">• 開</span>
                  <span class="star-pill on"  style="left:19%;  top:30%;">• 開</span>
                  <span class="star-pill off" style="left:20%;  top:50%;">關</span>
                  <span class="star-pill on"  style="left:30%;  top:70%;">• 開</span>
                  <span class="star-pill off" style="right:25%; bottom:10%;">關</span>
                </div>
              </div>
            </article>

            <!-- bubble 2: usage instructions companion card -->
            <article class="bubble bubble-nano">
              <div class="manual-bubble-body">
                <!-- section-title bar pattern matching equipment-flex-preview.html -->
                <div class="manual-header">
                  <span class="bar" style="background:#b6322d;"></span>
                  <span class="section-text">使用說明</span>
                </div>
                <div class="manual-steps">
                  <div class="manual-step-row">
                    <span class="step-num">①</span>
                    <span class="step-text">右下為起點</span>
                  </div>
                  <div class="manual-step-row">
                    <span class="step-num">②</span>
                    <span class="step-text">左上為終點</span>
                  </div>
                  <div class="manual-step-row">
                    <span class="step-num">③</span>
                    <span class="step-text">照順序進行開關</span>
                  </div>
                </div>
              </div>
            </article>

          </div><!-- .carousel-bubbles -->
        </section>

      </div><!-- .previews -->
    </main>
  </body>
</html>
