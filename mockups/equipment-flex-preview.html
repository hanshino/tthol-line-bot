<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>裝備查詢 Flex Message Mockup</title>
    <style>
      :root {
        font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: #171b22;
        background: #eeeeee;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #eeeeee; }
      main { padding: 32px 20px 48px; }
      h1 { margin: 0 0 28px; text-align: center; font-size: 24px; }
      .previews { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 32px; }
      .preview { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      .carousel-bubbles { display: flex; flex-direction: column; gap: 12px; }
      .label { color: #585e68; font-size: 14px; font-weight: 700; }
      .bubble { width: 300px; overflow: hidden; background: #fcfaf6; border-radius: 20px; box-shadow: 0 5px 18px rgba(23, 27, 34, .14); }
      .box { display: flex; min-width: 0; }
      .vertical { flex-direction: column; }
      .horizontal, .baseline { flex-direction: row; }
      .center { align-items: center; }
      .between { justify-content: space-between; }
      .grow { flex: 1; min-width: 0; }
      .hero-slot { width: 100%; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: #e8e4da; color: #585e68; font-size: 13px; }
      .hero-slot span { padding: 8px; text-align: center; }
      .header { padding: 14px 16px 12px; background: #b6322d; }
      .header-meta { display: flex; flex-direction: row; gap: 12px; margin-top: 6px; }
      .title { color: #f9f6f1; font-size: 20px; font-weight: 700; line-height: 1.25; }
      .title.icon-title { font-size: 17px; }
      .pill { display: flex; align-items: center; justify-content: center; padding: 3px 10px; border-radius: 20px; background: #f9f6f1; color: #b6322d; font-size: 11px; font-weight: 700; white-space: nowrap; }
      .muted { color: #f9f6f1; font-size: 11px; opacity: .75; white-space: nowrap; }
      .description { padding: 12px 16px 4px; color: #585e68; font-size: 11px; line-height: calc(1em + 6px); }
      .description.icon-description { padding-bottom: 8px; }
      .section-title { display: flex; align-items: center; padding: 14px 16px 6px; }
      .icon-section-title { padding-top: 4px; padding-bottom: 8px; }
      .bar { width: 3px; height: 14px; border-radius: 2px; background: #b6322d; }
      .section-text { margin-left: 8px; font-size: 13px; font-weight: 700; }
      .stats { display: flex; flex-direction: column; padding: 0 16px 16px; }
      .stat-row { display: flex; flex-direction: row; padding: 8px 12px; font-size: 11px; }
      .stat-row:nth-child(odd) { background: #f9f6f1; }
      .stat-row:nth-child(even) { background: #fcfaf6; }
      .stat-row:first-child { border-radius: 6px 6px 0 0; }
      .stat-row:last-child { border-radius: 0 0 6px 6px; }
      .stat-label { flex: 3; color: #585e68; }
      .stat-value { flex: 2; text-align: right; font-size: 13px; font-weight: 700; }
      .icon-header { display: flex; flex-direction: row; align-items: center; gap: 10px; padding: 14px 16px 12px; background: #b6322d; }
      .icon-frame { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; flex: 0 0 44px; padding: 2px; border-radius: 8px; background: #f9f6f1; }
      .icon-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: #d6c68b; color: #744c7d; font-size: 10px; font-weight: 700; }
      .icon-copy { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 6px; }
      .icon-title-row { display: flex; flex-direction: row; align-items: center; gap: 6px; }
      .icon-meta { display: flex; flex-direction: row; gap: 12px; }
      .outlined-stats { display: flex; flex-direction: row; gap: 0; padding: 12px; border: 1px solid #dbd7cf; border-radius: 8px; background: #f9f6f1; }
      .stat-column { display: flex; flex: 1; flex-direction: column; gap: 6px; }
      .compact-row { display: flex; flex-direction: row; font-size: 11px; }
      .compact-row .stat-label, .compact-row .stat-value { flex: 1; font-size: 11px; }
      @media (max-width: 680px) { main { padding-left: 12px; padding-right: 12px; } .previews { gap: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>裝備查詢 Flex Message Mockup</h1>
      <div class="previews">
        <section class="preview">
          <div class="label">Variant A: Hero Image</div>
          <div class="carousel-bubbles">
            <article class="bubble">
              <div class="hero-slot" title="https://img.hanshino.dev/mounts/chiyen-qilin.png" aria-label="赤焰麒麟圖片預留位"><span>赤焰麒麟<br />圖片預留位</span></div>
              <div class="box vertical header" style="padding-top:12px;padding-bottom:10px">
                <div class="box horizontal center" style="gap:10px"><div class="icon-frame" style="width:36px;height:36px;flex-basis:36px" title="https://img.hanshino.dev/icons/chiyen-qilin-icon.png" aria-label="赤焰麒麟圖示預留位"><div class="icon-placeholder">圖示</div></div><span class="title grow">赤焰麒麟</span><span class="pill">座騎</span></div>
                <div class="header-meta" style="margin-top:0"><span class="muted">#1042</span><span class="muted">等級 60</span><span class="muted">重量 30</span><span class="muted">售價 9800</span></div>
              </div>
            </article>
            <article class="bubble">
              <div class="box vertical header" style="padding-top:14px;padding-bottom:14px"><span class="muted" style="font-size:13px;font-weight:700;opacity:.85">赤焰麒麟</span></div>
              <div class="description" style="padding-top:14px;padding-bottom:10px">傳說中居住在火焰山脈深處的靈獸，騎乘者可感受到灼熱的力量湧入全身。</div>
              <div class="section-title" style="padding-top:6px;padding-bottom:8px"><span class="bar"></span><span class="section-text">屬性</span></div>
              <div class="stats">
                <div class="stat-row"><span class="stat-label">生命</span><span class="stat-value">+500</span></div>
                <div class="stat-row"><span class="stat-label">攻擊</span><span class="stat-value" style="color:#b6322d">+120</span></div>
                <div class="stat-row"><span class="stat-label">敏捷</span><span class="stat-value">+45</span></div>
                <div class="stat-row"><span class="stat-label">移動速度</span><span class="stat-value" style="color:#54967a">+10</span></div>
                <div class="stat-row"><span class="stat-label">耐久</span><span class="stat-value">200</span></div>
              </div>
            </article>
          </div>
        </section>
        <section class="preview">
          <div class="label">Variant B: Icon Header</div>
          <article class="bubble">
            <div class="icon-header">
              <div class="icon-frame" title="https://img.hanshino.dev/icons/hat-jade-crown.png" aria-label="翠玉鳳冠圖示預留位"><div class="icon-placeholder">圖示</div></div>
              <div class="icon-copy">
                <div class="icon-title-row"><span class="title icon-title grow">翠玉鳳冠</span><span class="pill">帽</span></div>
                <div class="icon-meta"><span class="muted">#0527</span><span class="muted">等級 45</span><span class="muted">重量 15</span><span class="muted">售價 4200</span></div>
              </div>
            </div>
            <div class="description icon-description">以上等翠玉精雕而成的頭冠，鑲嵌玄鳥羽毛，戴上後如鳳凰降臨。</div>
            <div class="stats" style="padding-top:4px">
              <div class="section-title icon-section-title"><span class="bar"></span><span class="section-text">屬性</span></div>
              <div class="outlined-stats">
                <div class="stat-column">
                  <div class="compact-row"><span class="stat-label">生命</span><span class="stat-value">+500</span></div>
                  <div class="compact-row"><span class="stat-label">法力</span><span class="stat-value" style="color:#2c6194">+120</span></div>
                  <div class="compact-row"><span class="stat-label">魔攻</span><span class="stat-value" style="color:#744c7d">+45</span></div>
                </div>
                <div class="stat-column">
                  <div class="compact-row"><span class="stat-label">智慧</span><span class="stat-value" style="color:#2c6194">+38</span></div>
                  <div class="compact-row"><span class="stat-label">魔防</span><span class="stat-value">+60</span></div>
                  <div class="compact-row"><span class="stat-label">迴避</span><span class="stat-value">+15</span></div>
                </div>
              </div>
            </div>
          </article>
        </section>
      </div>
    </main>
  </body>
</html>
