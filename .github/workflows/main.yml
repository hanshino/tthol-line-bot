name: tthol linebot CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      # test/ holds standalone scripts (zero jest tests), so only run src/. Models need the env var at require time.
      - run: npx jest src
        env:
          TTHOL_DATABASE: ci-dummy.sqlite
      - name: Audit production dependencies (report only)
        run: yarn audit --groups dependencies --level high
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (and push on master)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/hanshino/tthol-line-bot:latest
            ghcr.io/hanshino/tthol-line-bot:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/hanshino/tthol-line-bot:buildcache
          cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/hanshino/tthol-line-bot:buildcache,mode=max' || '' }}
